[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allure-history"
version = "0.3.0"
description = "Cross-run test history matrix and flaky-test ranking from Allure results"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
allure-history = "allure_history.cli:main"

[tool.setuptools]
packages = ["allure_history"]
